<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>bleib. Demo-App</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9EE">
<meta name="description" content="bleib. – Demo-App eines Studierendenprojekts der DHBW Mosbach">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700;800&family=Permanent+Marker&display=swap">
<style>
/* Layout: one phone-sized app column, full-bleed on phones, framed on desktop.
   Look = bleib. pitch design system: cream ground, ink outlines with hard offset shadows,
   loud accents (orange, blue, lime, pink), pastel cards, marker-font stickers. Single light look. */
:root{
  --ground:#FFF9EE; --card:#FFFFFF; --ink:#14161F; --soft:#4B4F63; --muted:#4B4F63; --line:#E6DFD0; --chipline:#14161F;
  --orange:#FF5B1F; --blue:#2B4BFF; --lime:#C8FF3F; --pink:#FF5CBA;
  --peach:#FFD6C2; --sky:#CBDDFF; --limepale:#EEFFB8; --lav:#DDD0FF; --mint:#BDF4DD; --butter:#FFEDA8; --sand:#F1EBDD;
  --accent:#FF5B1F; --accent-soft:#FFD6C2; --accent-ink:#B23A0C;
  --green:#2B4BFF; --green-soft:#BDF4DD; --green-ink:#14161F;
  --outer:#F3ECDD;
  --shadow:3px 4px 0 #14161F; --shadow-sm:2px 3px 0 #14161F;
  --display:'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif;
  --body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --marker:'Permanent Marker', 'Comic Sans MS', cursive;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{background:var(--outer);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.main,.msgs,.chips.scroll{scrollbar-width:none;-ms-overflow-style:none}
.main::-webkit-scrollbar,.msgs::-webkit-scrollbar,.chips.scroll::-webkit-scrollbar{display:none}

.frame{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){
  body{padding-block:24px;box-sizing:border-box}
  .frame{height:min(900px,100%);border-radius:38px;border:10px solid var(--ink);box-shadow:8px 10px 0 rgba(20,22,31,.18)}
}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:22px max(18px, env(safe-area-inset-right, 0px)) 24px max(18px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px}

.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.brand b{color:var(--orange)}
.h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0;font-size:14.5px;line-height:1.5;color:var(--soft)}
.small{font-size:12.5px;color:var(--soft)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sticker{align-self:flex-start;font-family:var(--marker);font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding:5px 14px;border:2px solid var(--ink);border-radius:8px;background:var(--butter);box-shadow:var(--shadow-sm);transform:rotate(-2deg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px}
.chip{min-height:42px;padding:0 15px;border-radius:999px;border:2px solid var(--ink);background:var(--card);font-size:14.5px;font-weight:600;cursor:pointer;flex-shrink:0;transition:transform .12s,background .15s,box-shadow .12s}
.chip[aria-pressed="true"]{background:var(--lime);box-shadow:var(--shadow-sm)}
.chip:active{transform:translate(1px,2px);box-shadow:none}

.btn{min-height:54px;border-radius:999px;border:2px solid var(--ink);background:var(--orange);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.dark{background:var(--ink);color:var(--ground)}
.btn.sm{min-height:40px;font-size:14px;padding:0 16px;box-shadow:var(--shadow-sm)}
.btn:disabled{opacity:.45;box-shadow:none}
.link{background:none;border:none;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:6px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.input{height:48px;box-sizing:border-box;width:100%;border:2px solid var(--ink);border-radius:14px;padding:0 13px;font:400 16px var(--body);color:var(--ink);background:var(--card)}
.input:focus{outline:none;box-shadow:3px 3px 0 var(--orange)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* nav */
.nav{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--ink);padding:6px 6px env(safe-area-inset-bottom, 0px)}
.nav button{background:none;border:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--soft);cursor:pointer;position:relative;border-radius:16px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:800;background:var(--lime);border:2px solid var(--ink)}
.nav svg{width:22px;height:22px}
.badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:var(--ink);border:1.5px solid var(--ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* people */
.person{padding:14px;display:flex;gap:12px}
.ava{width:48px;height:48px;border-radius:50%;flex-shrink:0;color:var(--ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;box-sizing:border-box}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sand);color:var(--soft);border:1.5px solid transparent}
.tag.on{background:var(--limepale);color:var(--ink);border-color:var(--ink)}
.shared{font-size:12px;font-weight:800;color:var(--blue)}

/* deck */
.deck{position:relative;height:440px;touch-action:pan-y}
.ecard{position:absolute;inset:0;border-radius:24px;background:var(--card);border:2px solid var(--ink);overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 6px 0 var(--ink);transition:transform .35s cubic-bezier(.3,.7,.3,1),opacity .35s;user-select:none;-webkit-user-select:none}
.ecard.under{transform:translateY(12px) scale(.95);opacity:.7}
.ecard.top{cursor:grab}
.ecard.drag{transition:none;cursor:grabbing}
.ehero{height:190px;flex-shrink:0;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;border-bottom:2px solid var(--ink)}
.pill{align-self:flex-start;font-family:var(--marker);font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding:4px 12px;border-radius:8px;background:var(--card);color:var(--ink);border:2px solid var(--ink);transform:rotate(-2deg)}
.etime{font-family:var(--display);font-weight:800;line-height:1;text-align:right}
.etime small{display:block;font-size:14px;font-weight:700}
.etime span{font-size:30px}
.etitle{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.02;letter-spacing:-.025em}
.ebody{padding:14px 16px;display:flex;flex-direction:column;gap:9px;font-size:14px;color:var(--soft);flex:1}
.meta{display:flex;align-items:center;gap:8px}
.meta svg{width:17px;height:17px;flex-shrink:0}
.cost{white-space:nowrap;align-self:flex-start;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink)}
.cost.free{background:var(--mint)}
.cost.paid{background:var(--peach)}
.match{font-size:12px;font-weight:800;color:var(--blue)}
.stamp{position:absolute;top:26px;font-family:var(--marker);font-size:24px;padding:4px 14px;border-radius:10px;border:3px solid var(--ink);color:var(--ink);opacity:0;pointer-events:none;box-shadow:var(--shadow-sm)}
.stamp.yes{left:18px;background:var(--lime);transform:rotate(-10deg)}
.stamp.no{right:18px;background:var(--pink);transform:rotate(10deg)}
.swbtns{display:flex;justify-content:center;gap:36px;padding-top:4px}
.swb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.round{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--ink);box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s;color:var(--ink)}
.round:active{transform:translate(2px,3px);box-shadow:none}
.round.no{background:var(--card)}
.round.yes{background:var(--lime)}
.round svg{width:28px;height:28px}

/* overlay screens */
.layer{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;z-index:20;animation:slidein .28s ease}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:14px 16px}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-sm)}
.back svg{width:22px;height:22px}
.hero{padding:6px 20px 22px;display:flex;flex-direction:column;gap:12px}
.hero .h1{font-size:32px}
.hero .meta{font-size:14px;font-weight:600}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,22,31,.45);z-index:30;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--ground);border-top:2px solid var(--ink);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.3,.7,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grip{width:44px;height:6px;border-radius:3px;background:var(--ink);align-self:center;margin-top:-8px}
.price{font-family:var(--display);font-weight:800;font-size:26px;color:var(--ink);background:var(--peach);border:2px solid var(--ink);border-radius:12px;padding:2px 10px;box-shadow:var(--shadow-sm)}
.why{background:var(--butter);border:2px solid var(--ink);border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.45;color:var(--ink)}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.tick{width:74px;height:74px;border-radius:50%;background:var(--lime);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.tick svg{width:36px;height:36px}
@keyframes pop{from{transform:scale(.3)}}

/* chat */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:9px 13px;display:flex;flex-direction:column;gap:3px;font-size:15px;line-height:1.4;border:2px solid var(--ink)}
.msg.other{align-self:flex-start;background:var(--card);border-radius:18px 18px 18px 5px}
.msg.host{align-self:flex-start;background:var(--mint);border-radius:18px 18px 18px 5px}
.msg.me{align-self:flex-end;background:var(--blue);color:#FFFFFF;border-radius:18px 18px 5px 18px}
.msg .who{font-size:12px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center}
.msg time{align-self:flex-end;font-size:11px;opacity:.8}
.hosttag{font-family:var(--marker);font-size:10.5px;padding:1px 7px;border-radius:6px;background:var(--lime);color:var(--ink);border:1.5px solid var(--ink)}
.composer{flex-shrink:0;background:var(--card);border-top:2px solid var(--ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px}
.send{width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:var(--orange);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;box-shadow:var(--shadow-sm)}
.send svg{width:20px;height:20px}
.qchip{min-height:36px;font-size:13px;padding:0 12px}

/* badges */
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;box-shadow:var(--shadow-sm)}
.medal.cur{background:var(--limepale);box-shadow:var(--shadow)}
.medal.locked{border-style:dashed;box-shadow:none;background:transparent}
.medal b{font-family:var(--display);font-size:15px}
.state{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--ink)}
.bar{height:12px;border-radius:6px;background:var(--card);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);transition:width .6s ease}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border-radius:14px;padding:11px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:800;font-size:24px}
.stat span{font-size:12px}

.switch{width:56px;height:34px;border-radius:17px;border:2px solid var(--ink);padding:3px;box-sizing:border-box;display:flex;cursor:pointer;background:var(--card);transition:background .2s;flex-shrink:0}
.switch i{width:24px;height:24px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--lime)}
.switch[aria-checked="true"] i{transform:translateX(22px)}

.toast{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top, 0px));z-index:50;background:var(--ink);color:var(--ground);border:2px solid var(--ink);border-radius:16px;padding:13px 16px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;animation:toast .3s ease;box-shadow:4px 5px 0 var(--orange)}
@keyframes toast{from{transform:translateY(-20px);opacity:0}}
.toast svg{width:20px;height:20px;flex-shrink:0;color:var(--lime)}
.demo{font-size:11.5px;color:var(--soft);text-align:center}

.list-ev{display:flex;gap:12px;align-items:center;padding:10px;cursor:pointer;text-align:left;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:var(--shadow-sm)}
.datebox{width:58px;height:54px;border-radius:13px;border:2px solid var(--ink);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;line-height:1;flex-shrink:0}
.datebox small{font-size:12px}
.datebox span{font-size:17px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>


</head>

<script>
(function(){
'use strict';
var app = document.getElementById('app');

/* ---------- data ---------- */
var CATS = ['Sport','Party','Kultur','Gaming','Natur','Kochen','Musik','Lerngruppe'];
var COLORS = {Sport:['#2B4BFF','#FFFFFF'],Party:['#FF5CBA','#14161F'],Kultur:['#DDD0FF','#14161F'],Gaming:['#C8FF3F','#14161F'],Natur:['#BDF4DD','#14161F'],Kochen:['#FF5B1F','#14161F'],Musik:['#FFEDA8','#14161F'],Lerngruppe:['#CBDDFF','#14161F']};
function catStyle(c){ var x = COLORS[c] || ['#CBDDFF','#14161F']; return x[0]+';color:'+x[1]; }
var PEOPLE = [
  {name:'Jonas',course:'Maschinenbau · MB24',tags:['Sport','Natur','Gaming'],color:'#CBDDFF'},
  {name:'Aylin',course:'BWL – Industrie · BI24',tags:['Party','Kochen','Musik'],color:'#FF5CBA'},
  {name:'Tim',course:'Informatik · INF23',tags:['Gaming','Sport','Lerngruppe'],color:'#C8FF3F'},
  {name:'Mara',course:'Soziale Arbeit · SA24',tags:['Kultur','Kochen','Natur'],color:'#DDD0FF'},
  {name:'Felix',course:'Elektrotechnik · ET24',tags:['Party','Sport','Musik'],color:'#FFD6C2'},
  {name:'Sofia',course:'Wirtschaftsinformatik · WI24',tags:['Kultur','Musik','Lerngruppe'],color:'#FFEDA8'}
];
var EVENTS = [
  {id:'volley',title:'Volleyball am Neckar',cat:'Sport',day:'Sa',time:'14:00',place:'Treffpunkt Bahnhof Neckarelz',taken:8,total:12,fee:0,host:'Jonas',text:'Lockeres Beachvolleyball für alle Level. Netz und Ball sind da.'},
  {id:'kochen',title:'Spätzle-Kochabend',cat:'Kochen',day:'Sa',time:'18:30',place:'WG-Küche in der Altstadt',taken:5,total:8,fee:4,feeFor:'Zutaten',host:'Mara',text:'Gemeinsam kochen und essen – Mara kauft vorher die Zutaten ein.'},
  {id:'party',title:'Semester-Party',cat:'Party',day:'Sa',time:'22:00',place:'Location in der Altstadt',taken:34,total:80,fee:5,feeFor:'Location-Miete und DJ',host:'Aylin',text:'Die erste große Party des Semesters – mit Leuten aus allen Studiengängen.'},
  {id:'zocken',title:'Mario-Kart-Turnier',cat:'Gaming',day:'Fr',time:'20:00',place:'Wohnheim, Gemeinschaftsraum',taken:9,total:16,fee:0,host:'Tim',text:'Bring deinen Controller mit, wenn du einen hast. Für Snacks ist gesorgt.'},
  {id:'wandern',title:'Wanderung zur Burg Hornberg',cat:'Natur',day:'So',time:'10:30',place:'Start am Bahnhof Mosbach',taken:6,total:15,fee:0,host:'Jonas',text:'Gemütliche Runde am Neckar entlang, oben gibt es Aussicht und Kaffee.'},
  {id:'jam',title:'Open-Mic & Jam Session',cat:'Musik',day:'So',time:'17:00',place:'Café in der Hauptstraße',taken:12,total:30,fee:0,host:'Sofia',text:'Instrument mitbringen oder einfach zuhören.'},
  {id:'girls',title:'Girls Night: Cocktails & Karaoke',cat:'Party',day:'Fr',time:'20:30',place:'WG in der Altstadt',taken:7,total:12,fee:3,feeFor:'Cocktail-Zutaten',host:'Aylin',aud:'w',div:true,text:'Entspannter Abend mit Cocktails, Snacks und Karaoke.'},
  {id:'maenner',title:'Männerabend: Grillen & Fußball',cat:'Sport',day:'Sa',time:'17:00',place:'Grillplatz am Neckar',taken:6,total:10,fee:4,feeFor:'Grillgut und Kohle',host:'Felix',aud:'m',div:false,text:'Erst Kicken auf der Wiese, dann Grillen und das Abendspiel schauen.'}
];
var CHAT0 = {
  party:[{who:'Felix',text:'Gibt es eine Garderobe?',t:'18:02'},{who:'Aylin',host:true,text:'Ja, direkt am Eingang.',t:'18:10'},{who:'Mara',text:'Kann man später noch zusagen?',t:'19:41'},{who:'Aylin',host:true,text:'Klar, solange Plätze frei sind!',t:'19:45'}],
  volley:[{who:'Tim',text:'Spielen wir auch bei Regen?',t:'09:12'},{who:'Jonas',host:true,text:'Bei Regen gehen wir in die Halle – ich schreibe es dann hier rein.',t:'09:30'}]
};
var REPLIES = {
  'Was soll ich mitbringen?':'Nur gute Laune! Alles andere ist organisiert.',
  'Wie komme ich hin?':'Vom Bahnhof sind es etwa 10 Minuten zu Fuß, ich schicke den Pin gleich.',
  'Kann ich jemanden mitbringen?':'Gerne, solange die Person an der DHBW studiert.'
};

/* ---------- state ---------- */
var S = {
  started:false, later:false, course:'', step:'welcome', verified:false, v:{mail:'',matr:'',img:'',imgName:''}, vErr:'', name:'', gender:'', interests:['Sport','Party'], when:['Am Wochenende'],
  tab:'events', filter:'Alle', sent:[], deck:[], idx:0, accepted:[], declined:[],
  stack:[], sheet:null, method:'PayPal', chats:JSON.parse(JSON.stringify(CHAT0)),
  myEvents:[], host:{title:'',cat:'Gaming',day:'Fr',time:'19:30',place:'',max:'10',costs:false,fee:'',feeFor:'',aud:'alle',div:true}, posted:null, toast:null
};
function buildDeck(){
  var ev = EVENTS.filter(eligible);
  S.hidden = EVENTS.length - ev.length;
  ev.sort(function(a,b){ return score(b)-score(a); });
  S.deck = ev.map(function(e){ return e.id; }); S.idx = 0;
}
function eligible(e){ if (!e.aud || e.aud === 'alle') return true; if (S.gender === 'Divers') return !!e.div; return (e.aud === 'w' && S.gender === 'Weiblich') || (e.aud === 'm' && S.gender === 'Männlich'); }
function audLabel(e){ if (!e.aud || e.aud === 'alle') return ''; return (e.aud === 'w' ? 'Nur für Frauen' : 'Nur für Männer') + (e.div ? ' und diverse Personen' : ''); }
function audPill(e){ return (e.aud && e.aud !== 'alle') ? '<span class="cost" style="background:#CBDDFF;color:#14161F">'+audLabel(e)+'</span>' : ''; }
function score(e){ return S.interests.indexOf(e.cat) >= 0 ? 1 : 0; }
function ev(id){ return EVENTS.concat(S.myEvents).filter(function(e){ return e.id === id; })[0]; }

function medal(kind, locked){
  var c = {bronze:['#C98A5B','#8C5530','#F0C9A8','#7A4A2A'],silber:['#C7CED4','#5E6A74','#F4F6F8','#2B4BFF'],gold:['#E8C34A','#A9811A','#FFF1C2','#FF5B1F']}[kind];
  var svg = '<svg width="58" height="66" viewBox="0 0 62 70" aria-hidden="true" style="opacity:'+(locked?0.38:1)+'"><path d="M18 46l-6 22 9-5 6 7 4-20z" fill="'+c[3]+'"/><path d="M44 46l6 22-9-5-6 7-4-20z" fill="'+c[3]+'"/><path d="M31 2l24 14v26L31 56 7 42V16z" fill="'+c[0]+'" stroke="'+c[1]+'" stroke-width="2.5"/><path d="M31 9l18 10.5v19L31 49 13 38.5v-19z" fill="none" stroke="'+c[2]+'" stroke-width="1.5"/><path d="M31 18l3.4 7 7.6 1.1-5.5 5.3 1.3 7.6L31 35.4 24.2 39l1.3-7.6-5.5-5.3 7.6-1.1z" fill="'+c[1]+'"/></svg>';
  if (!locked) return svg;
  return '<span style="position:relative;display:inline-block;width:58px;height:66px">'+svg+'<span style="position:absolute;left:17px;top:15px;width:24px;height:24px;border-radius:50%;background:#14161F;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><span style="width:13px;height:13px;display:flex">'+I.lock+'</span></span></span>';
}
var LEVELS = [{k:'bronze',n:'Bronze',at:1},{k:'silber',n:'Silber',at:10},{k:'gold',n:'Gold',at:25}];
function medals(count){
  var cur = -1; LEVELS.forEach(function(l,i){ if (count >= l.at) cur = i; });
  var html = '<div class="medals">' + LEVELS.map(function(l,i){
    var locked = count < l.at, isCur = i === cur;
    var st = locked ? '<span class="state" style="background:#F1EBDD;color:#4B4F63">gesperrt</span>' : isCur ? '<span class="state" style="background:#14161F;color:#FFFFFF">aktuell</span>' : '<span class="state" style="background:#BDF4DD;color:#14161F">erreicht</span>';
    return '<div class="medal'+(isCur?' cur':'')+(locked?' locked':'')+'">'+medal(l.k,locked)+'<b>'+l.n+'</b><span class="small">ab '+l.at+' Event'+(l.at===1?'':'s')+'</span>'+st+'</div>';
  }).join('') + '</div>';
  var next = LEVELS.filter(function(l){ return count < l.at; })[0];
  if (next){
    var prev = cur >= 0 ? LEVELS[cur].at : 0;
    var pct = Math.round(count / next.at * 100);
    html += '<div class="card" style="padding:13px 14px;display:flex;flex-direction:column;gap:8px"><div class="between" style="font-size:13.5px"><b>Noch '+(next.at-count)+' Event'+(next.at-count===1?'':'s')+' bis '+next.n+'</b><span class="small">'+count+' / '+next.at+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><span class="small">Höhere Abzeichen werden in der Event-Liste weiter oben angezeigt.</span></div>';
  }
  return html;
}
function levelName(count){ var n = 'Neu'; LEVELS.forEach(function(l){ if (count >= l.at) n = l.n; }); return n; }

var lastView = '';
function viewKey(){ return [S.started, S.step, S.tab, S.posted || '', S.stack.map(function(l){ return l.type + ':' + (l.id || l.name || ''); }).join('|')].join('#'); }
function render(){
  var key = viewKey(), same = key === lastView;
  var keep = same ? Array.prototype.map.call(app.querySelectorAll('.main, .chips.scroll'), function(el){ return [el.scrollTop, el.scrollLeft]; }) : [];
  var focusId = same && document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : '';
  var html;
  if (!S.started){ html = S.step === 'verify' ? verify() : S.step === 'code' ? codeScreen() : welcome(); }
  else {
    html = '<div class="main" id="main">' + ({matches:matches,events:events,host:hostForm,profil:profil})[S.tab]() + '</div>' + nav();
    S.stack.forEach(function(l){ html += layer(l); });
    if (S.sheet) html += sheet();
  }
  if (S.toast) html += '<div class="toast" role="status">'+I.check+'<span>'+esc(S.toast)+'</span></div>';
  app.innerHTML = html;
  lastView = key;
  if (keep.length){ Array.prototype.forEach.call(app.querySelectorAll('.main, .chips.scroll'), function(el, i){ if (keep[i]){ el.scrollTop = keep[i][0]; el.scrollLeft = keep[i][1]; } }); }
  if (focusId){ var fe = document.getElementById(focusId); if (fe && /^(INPUT|SELECT|TEXTAREA)$/.test(fe.tagName)) { try { fe.focus({preventScroll:true}); } catch (_) {} } }
  if (S.started && S.tab === 'events' && !S.stack.length && !S.sheet) bindSwipe();
  var m = app.querySelector('.msgs'); if (m) m.scrollTop = m.scrollHeight;
}
var toastTimer;

/* ---------- actions ---------- */
function toggle(list, v){ var i = list.indexOf(v); if (i >= 0) list.splice(i,1); else list.push(v); }
function accept(id){
  var e = ev(id);
  if (S.accepted.indexOf(id) >= 0) return;
  if (e.fee){ S.sheet = {id:id, paid:false}; render(); return; }
  S.accepted.push(id); toast('Zugesagt: '+e.title);
}
function advance(dir){
  var id = S.deck[S.idx];
  var card = document.getElementById('topcard');
  if (dir > 0 && ev(id).fee){ if (card){ card.style.transform = ''; card.querySelectorAll('.stamp').forEach(function(x){ x.style.opacity = 0; }); } S.sheet = {id:id, paid:false, deck:true}; render(); return; }
  var go = function(){
    if (dir > 0){ var e = ev(id); S.idx++; S.accepted.push(id); toast('Zugesagt: '+e.title); }
    else { S.declined.push(id); S.idx++; }
    render();
  };
  if (card && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    card.style.transform = 'translateX('+(dir*140)+'%) rotate('+(dir*18)+'deg)'; card.style.opacity = '0';
    var st = card.querySelector('.stamp.'+(dir>0?'yes':'no')); if (st) st.style.opacity = 1;
    setTimeout(go, 260);
  } else go();
}
function sendChat(id, text){
  text = (text||'').trim(); if (!text) return;
  var e = ev(id); S.chats[id] = S.chats[id] || [];
  S.chats[id].push({who:me(), me:true, text:text, t:now()});
  S.typing = id; render();
  setTimeout(function(){
    S.chats[id].push({who:e.host, host:true, text:REPLIES[text] || 'Gute Frage! Ich ergänze das gleich in den Event-Infos.', t:now()});
    S.typing = null; render();
  }, 1300);
}
function publish(){
  var h = S.host, err = document.getElementById('h-err');
  if (!h.title.trim()){ err.textContent = 'Gib deinem Event einen Titel.'; document.getElementById('h-title').focus(); return; }
  var fee = h.costs ? parseFloat(String(h.fee).replace(',','.')) : 0;
  if (h.costs && !(fee > 0)){ err.textContent = 'Trag einen Beitrag pro Person ein oder schalte die Kosten aus.'; document.getElementById('h-fee').focus(); return; }
  var max = Math.max(2, Math.min(200, parseInt(h.max,10) || 10));
  var id = 'mine' + (S.myEvents.length + 1);
  var e = {id:id, mine:true, title:h.title.trim(), cat:h.cat, day:h.day, time:h.time||'19:30', place:h.place.trim(), taken:1, total:max, fee:fee, feeFor:h.feeFor.trim(), aud:h.aud, div:h.div, host:me(), text:'Gehostet von '+me()+'. Stell deine Fragen gern im Event-Chat.'};
  var before = levelName(S.myEvents.length);
  S.myEvents.push(e); S.chats[id] = [];
  var after = levelName(S.myEvents.length);
  S.posted = id;
  toast(before !== after ? after + '-Abzeichen freigeschaltet!' : 'Event veröffentlicht');
  render();
}

app.addEventListener('click', function(ev0){
  var t = ev0.target.closest('[data-a]'); if (!t) return;
  var a = t.getAttribute('data-a'), v = t.getAttribute('data-v');
  switch (a){
    case 'interest': toggle(S.interests, v); break;
    case 'when': toggle(S.when, v); break;
    case 'gender': S.gender = v; break;
    case 'haud': S.host.aud = v; break;
    case 'hdiv': S.host.div = !S.host.div; break;
    case 'start': var n = document.getElementById('nm'); S.name = n ? n.value : ''; var cr = document.getElementById('course'); if (cr) S.course = cr.value; if (S.verified){ S.started = true; buildDeck(); S.tab = 'matches'; } else { S.step = 'verify'; } break;
    case 'vback': if (S.later){ S.later = false; S.started = true; S.step = 'welcome'; } else { S.step = 'welcome'; } S.vErr = ''; break;
    case 'vskip': S.started = true; S.step = 'welcome'; S.vErr = ''; if (!S.later) { buildDeck(); S.tab = 'matches'; } S.later = false; toast('Übersprungen – du kannst das später im Profil nachholen'); break;
    case 'verifynow': S.started = false; S.step = 'verify'; S.later = true; S.stack = []; break;
    case 'cback': S.step = 'verify'; break;
    case 'vsend':
      if (!/^[^\s@]+@([a-z0-9-]+\.)*[a-z0-9-]*dhbw[a-z0-9-]*\.de$/i.test(S.v.mail.trim())){ S.vErr = 'Bitte gib deine DHBW-Mail ein (endet auf …dhbw…de).'; break; }
      if (!/^\d{7}$/.test(S.v.matr.trim())){ S.vErr = 'Die Matrikelnummer hat 7 Ziffern.'; break; }
      if (!S.v.img){ S.vErr = 'Füge ein Foto deines Studienausweises hinzu.'; break; }
      S.vErr = ''; S.step = 'code'; toast('Code an '+S.v.mail.trim()+' gesendet'); break;
    case 'resend': toast('Neuer Code gesendet (Demo: 2026)'); return;
    case 'vcode':
      var c = document.getElementById('v-code');
      if (!c || c.value.trim() !== '2026'){ var ce = document.getElementById('c-err'); if (ce) ce.textContent = 'Der Code stimmt nicht. Probier es nochmal (Demo-Code: 2026).'; if (c){ c.value = ''; c.focus(); } return; }
      S.verified = true; S.started = true; S.step = 'welcome'; if (S.later){ S.later = false; S.tab = 'profil'; } else { buildDeck(); S.tab = 'matches'; } toast('Verifiziert – willkommen bei bleib.!'); break;
    case 'tab': S.tab = v; S.stack = []; if (v !== 'host') S.posted = S.posted; break;
    case 'filter': S.filter = v; break;
    case 'hello': if (S.sent.indexOf(v) < 0){ S.sent.push(v); toast('Kontaktanfrage an '+v+' gesendet'); } break;
    case 'accept': advance(1); return;
    case 'decline': advance(-1); return;
    case 'acceptid': accept(v); break;
    case 'open': S.stack.push({type:'event', id:v}); break;
    case 'chat': if (v) S.stack.push({type:'chat', id:v}); else S.stack.pop(); break;
    case 'openhost': S.stack.push({type:'host', name:v}); break;
    case 'pop': S.stack.pop(); break;
    case 'restart': buildDeck(); S.declined = []; break;
    case 'method': S.method = v; break;
    case 'pay': S.accepted.push(S.sheet.id); if (S.sheet.deck && S.deck[S.idx] === S.sheet.id) S.idx++; S.sheet.paid = true; break;
    case 'closesheet': S.sheet = null; break;
    case 'quick': var f = t.closest('form'); sendChat(f.getAttribute('data-chat'), v); return;
    case 'hcat': S.host.cat = v; break;
    case 'hcost': S.host.costs = !S.host.costs; break;
    case 'publish': publish(); return;
    case 'newhost': S.posted = null; S.host = {title:'',cat:'Gaming',day:'Fr',time:'19:30',place:'',max:'10',costs:false,fee:'',feeFor:'',aud:'alle',div:true}; break;
    case 'editint': S.started = false; S.stack = []; break;
  }
  render();
});
app.addEventListener('input', function(e){
  var k = e.target.getAttribute('data-h'); if (k) S.host[k] = e.target.value;
  if (e.target.id === 'nm') S.name = e.target.value;
  if (e.target.id === 'course') S.course = e.target.value;
  var vf = e.target.getAttribute('data-vf'); if (vf) S.v[vf] = e.target.value;
});
app.addEventListener('change', function(e){
  if (e.target.id === 'v-img' && e.target.files && e.target.files[0]){
    var file = e.target.files[0];
    if (!/^image\//.test(file.type)){ S.vErr = 'Bitte wähle ein Bild aus.'; render(); return; }
    var rd = new FileReader(); rd.onload = function(){ S.v.img = rd.result; S.v.imgName = file.name; S.vErr = ''; render(); }; rd.readAsDataURL(file);
    return;
  } var k = e.target.getAttribute('data-h'); if (k) S.host[k] = e.target.value; });
app.addEventListener('submit', function(e){
  e.preventDefault(); var f = e.target, inp = f.querySelector('#msg');
  if (f.getAttribute('data-chat')) sendChat(f.getAttribute('data-chat'), inp.value);
  var again = app.querySelector('#msg'); if (again) again.focus();
});

/* ---------- swipe gesture ---------- */
function bindSwipe(){
  var card = document.getElementById('topcard'); if (!card) return;
  var sx = 0, dx = 0, down = false, yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; down = true; sx = e.clientX; dx = 0; card.classList.add('drag'); try{ card.setPointerCapture(e.pointerId); }catch(_){} });
  card.addEventListener('pointermove', function(e){ if (!down) return; dx = e.clientX - sx; card.style.transform = 'translateX('+dx+'px) rotate('+(dx/18)+'deg)'; yes.style.opacity = Math.max(0, Math.min(1, dx/90)); no.style.opacity = Math.max(0, Math.min(1, -dx/90)); });
  function end(){ if (!down) return; down = false; card.classList.remove('drag');
    if (Math.abs(dx) > 90){ advance(dx > 0 ? 1 : -1); }
    else { card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0; } }
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}

render();
})();
</script>
